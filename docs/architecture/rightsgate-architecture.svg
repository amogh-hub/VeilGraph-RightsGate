<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="1" stop-color="#10264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 50px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #b6c5dd; }
      .kicker { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #67e8f9; letter-spacing: 2px; }
      .cardTitle { font: 700 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; }
      .body { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #cbd5e1; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #cbd5e1; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; letter-spacing: 0.6px; }
      .chip { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .gate { font: 800 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="140" cy="80" r="230" fill="#7c3aed" opacity="0.10"/>
  <circle cx="1460" cy="750" r="300" fill="#06b6d4" opacity="0.08"/>

  <text x="82" y="92" class="kicker">VEILGRAPH RIGHTSGATE</text>
  <text x="82" y="151" class="title">Evidence-first trust gateway for AI media</text>
  <text x="82" y="194" class="subtitle">Inspect provenance, rights exposure and deployment policy before anything is published.</text>

  <rect x="82" y="235" width="1436" height="514" rx="30" fill="#0d1d36" stroke="#29405f" stroke-width="2" filter="url(#shadow)"/>

  <text x="122" y="284" class="kicker">MEDIA IN</text>
  <g>
    <rect x="122" y="309" width="112" height="42" rx="21" fill="#1e3352"/><text x="178" y="336" text-anchor="middle" class="chip">IMAGE</text>
    <rect x="244" y="309" width="112" height="42" rx="21" fill="#1e3352"/><text x="300" y="336" text-anchor="middle" class="chip">VIDEO</text>
    <rect x="366" y="309" width="112" height="42" rx="21" fill="#1e3352"/><text x="422" y="336" text-anchor="middle" class="chip">AUDIO</text>
    <rect x="488" y="309" width="112" height="42" rx="21" fill="#1e3352"/><text x="544" y="336" text-anchor="middle" class="chip">DOC</text>
  </g>

  <line x1="122" y1="382" x2="1478" y2="382" stroke="#28405e" stroke-width="2"/>

  <g transform="translate(122 416)">
    <rect width="396" height="210" rx="24" fill="#172554" stroke="#6366f1" stroke-width="2"/>
    <rect x="22" y="22" width="174" height="29" rx="14" fill="#a78bfa"/><text x="109" y="42" text-anchor="middle" class="label">IMAGE · IMPLEMENTED</text>
    <text x="22" y="88" class="cardTitle">Provenance</text>
    <text x="22" y="121" class="body">C2PA + metadata continuity</text>
    <text x="22" y="150" class="body">Watermark and tamper forensics</text>
    <text x="22" y="179" class="body">Whole / region / timeline evidence</text>
  </g>

  <g transform="translate(602 416)">
    <rect width="396" height="210" rx="24" fill="#173047" stroke="#22d3ee" stroke-width="2"/>
    <rect x="22" y="22" width="174" height="29" rx="14" fill="#67e8f9"/><text x="109" y="42" text-anchor="middle" class="label">IMAGE · IMPLEMENTED</text>
    <text x="22" y="88" class="cardTitle">Rights exposure</text>
    <text x="22" y="121" class="body">Copyright similarity + trademarks</text>
    <text x="22" y="150" class="body">Consented likeness / voice registry</text>
    <text x="22" y="179" class="body">Licence, territory and usage links</text>
  </g>

  <g transform="translate(1082 416)">
    <rect width="396" height="210" rx="24" fill="#183044" stroke="#34d399" stroke-width="2"/>
    <rect x="22" y="22" width="144" height="29" rx="14" fill="#6ee7b7"/><text x="94" y="42" text-anchor="middle" class="label">VEILGRAPH CORE</text>
    <text x="22" y="88" class="cardTitle">Deployment readiness</text>
    <text x="22" y="121" class="body">Policy-as-code by brand / region</text>
    <text x="22" y="150" class="body">Human review for uncertainty</text>
    <text x="22" y="179" class="body">Deterministic, fail-closed release</text>
  </g>

  <path d="M320 644 C320 684 566 670 686 694" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)" opacity="0.9"/>
  <path d="M800 644 L800 690" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)" opacity="0.9"/>
  <path d="M1280 644 C1280 684 1034 670 914 694" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)" opacity="0.9"/>

  <g transform="translate(572 672)">
    <rect width="456" height="64" rx="22" fill="url(#accent)"/>
    <text x="228" y="27" text-anchor="middle" class="label">ASSET EXPOSURE GRAPH + EVIDENCE</text>
    <text x="228" y="51" text-anchor="middle" style="font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#12213a">relationships turn weak clues into explainable risk</text>
  </g>

  <g transform="translate(82 788)">
    <text x="0" y="25" class="kicker">SIGNED WORKFLOW DECISION</text>
    <text x="0" y="57" class="small">Local-first • source-level evidence • versioned policy • non-authorizing Ed25519 receipt</text>
  </g>

  <g transform="translate(1116 788)">
    <rect x="0" y="0" width="116" height="52" rx="18" fill="#047857"/><text x="58" y="33" text-anchor="middle" class="gate">GO</text>
    <rect x="126" y="0" width="136" height="52" rx="18" fill="#b45309"/><text x="194" y="33" text-anchor="middle" class="gate">REVIEW</text>
    <rect x="272" y="0" width="130" height="52" rx="18" fill="#b91c1c"/><text x="337" y="33" text-anchor="middle" class="gate">BLOCK</text>
  </g>
</svg>
